descripcion = "Entrega real anonimizada de TP1 (ejercicio 1: conversor de unidades con biblioteca consola)"
origen = "real-anonimizado"
hallazgo = "N-ECO-24"

[herramientas.daedalus]
comando = ["daedalus", "compile", "repo/ejercicios/ejercicio1/main.c", "repo/ejercicios/ejercicio1/conversor.c", "repo/libs/consola/consola.c", "--flags", "-I repo/ejercicios/ejercicio1 -I repo/libs/consola", "--output", "/tmp/corpus_tp1_bin", "--json"]

[herramientas.gaff]
comando = ["gaff", "check", "repo/ejercicios/ejercicio1/", "--json"]

[herramientas.spunkmeyer]
comando = ["spunkmeyer", "detect", "repo/ejercicios/ejercicio1/", "--json"]

[herramientas.kaneda]
comando = ["kaneda", "audit", "repo/ejercicios/ejercicio1/", "--json"]

[herramientas.zhora]
comando = ["zhora", "check", "repo/ejercicios/ejercicio1/", "--json"]
