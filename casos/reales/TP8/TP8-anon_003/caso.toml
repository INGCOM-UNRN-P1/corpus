descripcion = "Entrega histórica real anonimizada de TP8 (biblioteca de arreglos y pruebas) importada con corpus ingest --anon"
origen = "real-anonimizado"
hallazgo = "N-ECO-24"

[herramientas.daedalus]
comando = ["daedalus", "compile", "repo/arreglos/prueba.c", "repo/arreglos/arreglos.c", "--flags", "-I repo/arreglos", "--output", "/tmp/corpus_tp8_bin", "--json"]

[herramientas.gaff]
comando = ["gaff", "check", "repo/arreglos/", "--json"]

[herramientas.spunkmeyer]
comando = ["spunkmeyer", "detect", "repo/arreglos/", "--json"]

[herramientas.kaneda]
comando = ["kaneda", "audit", "repo/arreglos/", "--json"]

[herramientas.zhora]
comando = ["zhora", "check", "repo/arreglos/", "--json"]
