        titulo: 'Invariante de unicidad y consistencia de cardinal'
        bloom: 4
      - id: conjunto_pertenencia_mutacion
        titulo: 'Inserción idempotente y eliminación contigua'
        bloom: 3
      - id: conjunto_algebra
        titulo: 'Operaciones algebraicas de unión, intersección y subconjuntos'
        bloom: 4
  - id: ejercicio4
    titulo: 'TDA Secuencia (secuencia_t) — Arreglo Dinámico vs Lista Enlazada'
    bloom: 4
    minutos: 60
    subpuntos:
      - id: secuencia_lista_conceptos
        titulo: 'Fundamentos de listas enlazadas, manipulación de nodos y operaciones básicas'
        bloom: 2
      - id: secuencia_interfaz
        titulo: 'Contrato de secuencia lineal indexada intercambiable'
        bloom: 4
      - id: secuencia_arreglo
        titulo: 'Implementación sobre memoria contigua con corrimiento'
        bloom: 3
      - id: secuencia_lista
        titulo: 'Implementación sobre cadena de nodos enlazados en heap'
        bloom: 4
      - id: secuencia_pruebas_caja_negra
        titulo: 'Evaluación de caja negra sobre ambas variantes'
        bloom: 4
